<script type="module">

// as every bone's world rotation and position, 30 times a second.
window.dump = async (name) => {
  const obj = await new FBXLoader().loadAsync('in/' + name + '.fbx'); obj.updateMatrixWorld(true);

  const P = g.attributes.position, C = g.attributes.color, SI = g.attributes.skinIndex, SW = g.attributes.skinWeight, bones = mesh.skeleton.bones;

    for (let k = 0; k < 4; k++) { si.push(idx.get(bones[SI.array[i * 4 + k]])); sw.push(+SW.array[i * 4 + k].toFixed(4)); }
  }

  for (const c of obj.animations) {
    const nm = c.name.split("|").pop().split("_").pop(), a = mixer.clipAction(c); mixer.stopAllAction(); a.setLoop(THREE.LoopOnce); a.clampWhenFinished = true; a.reset(); a.play();
    const fr = Math.max(2, Math.round(c.duration * 30) + 1), frames = [];
